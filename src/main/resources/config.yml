# ElytraLimit — ограничение горизонтальной скорости полёта на элитрах.
# Скорость указывается в БЛОКАХ В СЕКУНДУ.

# Включён ли плагин.
enabled: true

# Максимальная горизонтальная скорость для Meteor ElytraFly (блоков за тик).
# ВАЖНО: horizontal-speed в Meteor измеряется именно в блоках/тик.
# 0.8 — старое ограничение; 3.0 — разрешает примерно в 3.75 раза больше.
# Значение 3.0 означает до 60 блоков/секунду в идеальных условиях.
max-speed-blocks-per-tick: 3.0

# Старый параметр оставлен для совместимости. Используется только если параметр
# max-speed-blocks-per-tick удалить из конфига.
# Максимальная скорость в блоках/секунду.
# Ориентиры:
# 4.0  — очень медленно, чуть быстрее бега
# 7.0  — комфортный "элитра-флай" без ракет
# 10.0 — быстрее бега, но медленнее фейерверков
# 20.0 — уже близко к скорости с фейерверками
# 30.0+ — фактически без ограничений (фейерверки дают ~30–33 б/с)
max-speed-blocks-per-second: 60.0

# Дополнительно ограничивать вертикальную скорость (только подъём).
# Поставьте false, если хотите разрешить свободно набирать высоту.
limit-vertical: false
max-vertical-blocks-per-second: 10.0

# Показывать игроку сообщение при срабатывании лимита.
# Пусто = не показывать. Поддерживаются цвета вида &a, &c и т. п.
# Сообщение выводится в action bar не чаще одного раза в секунду.
speed-warning-message: ""

# Ограничение Meteor Step.
# Максимальный мгновенный подъём — не более 2.3 блока.
limit-step: true
max-step-height: 2.3

# Ограничение Meteor .vclip.
# Перемещения вниз от 5 до 10 блоков за один пакет ограничиваются до 5 блоков.
limit-vclip: true
vclip-min-distance: 5.0
vclip-max-distance: 10.0
